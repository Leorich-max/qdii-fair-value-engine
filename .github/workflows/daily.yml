name: daily-update

# Fetch public data after the A-share close, check it, rebuild app/data.js and publish the dashboard.
# 07:30 UTC = 15:30 Beijing, Mon-Fri. GitHub may start scheduled runs late; the page shows the actual
# data dates. If any source or check fails the job fails, nothing is committed, and the published page
# keeps its last good version.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Fetch, check, compute
        run: python -m qdii_fve.live.update

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data.js data/live/
          if git diff --cached --quiet; then
            echo "No change in the data."
          else
            git commit -m "data: daily update $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
